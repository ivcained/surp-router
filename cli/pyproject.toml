[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surp-cli"
version = "0.1.0"
description = "Command-line client for surp.ivc.lol — the OpenAI-compatible AI inference router with live cheapest-model routing."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["surp", "llm", "openai-compatible", "x402", "ai", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
surp = "surp_cli.cli:main"

[project.urls]
Homepage = "https://surp.ivc.lol"
Documentation = "https://surp.ivc.lol/docs"
Repository = "https://github.com/ivcained/surp-router"
