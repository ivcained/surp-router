<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>surp — cheapest LLM inference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════════════════════════════════
       surp design system — "Phosphor Terminal"

       A refined CRT-terminal aesthetic: deep black, phosphor green glow,
       monospace-forward typography, ASCII structure, bento grid layouts.
       Not generic crypto glassmorphism. Intentional, bold, distinctive.
       ════════════════════════════════════════════════════════════════════════ */

    :root {
      /* core palette */
      --bg:        #000000;
      --bg-card:   #080808;
      --bg-elev:  #0d0d0d;
      --border:    #1a1a1a;
      --border-bright: #2a2a2a;

      /* phosphor green — primary accent */
      --green:     #00ff9c;
      --green-dim: #00cc7d;
      --green-deep:#008f54;

      /* cyan — data, links, secondary */
      --cyan:      #5ce1ff;
      --cyan-dim:  #3aa8cc;

      /* amber — warnings, highlights */
      --amber:     #ffd23f;
      --amber-dim: #ccab33;

      /* red — errors, danger */
      --red:       #ff3b3b;
      --red-dim:   #cc3030;

      /* text */
      --text:      #e8e8e8;
      --text-dim:  #888888;
      --text-faint:#555555;

      /* glow shadows */
      --glow-green: 0 0 12px rgba(0,255,156,0.35), 0 0 4px rgba(0,255,156,0.6);
      --glow-cyan:  0 0 12px rgba(92,225,255,0.30), 0 0 4px rgba(92,225,255,0.5);
      --glow-amber: 0 0 12px rgba(255,210,63,0.30);

      /* fonts */
      --font-mono: 'JetBrains Mono', 'Berkeley Mono', 'Fira Code', 'SF Mono', monospace;
      --font-sans: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Scanline overlay — subtle CRT phosphor effect ──────────────────── */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,255,156,0.015) 3px,
        rgba(0,0,0,0) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    a { color: var(--cyan); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--green); text-shadow: var(--glow-green); }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--green);
      text-shadow: var(--glow-green);
    }

    h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--cyan);
      margin-bottom: 12px;
    }

    h3 { font-size: 14px; font-weight: 700; color: var(--text); }

    .sub {
      color: var(--text-dim);
      font-size: 12px;
      margin-bottom: 24px;
      font-family: var(--font-mono);
    }

    /* ── Cards — elevated dark with border ──────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: var(--border-bright);
    }

    /* ── Buttons ────────────────────────────────────────────────────────── */
    .btn {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: lowercase;
      letter-spacing: 0.3px;
    }
    .btn:hover {
      box-shadow: var(--glow-green);
      filter: brightness(1.1);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-outline {
      background: transparent;
      color: var(--cyan);
      border: 1px solid var(--cyan);
    }
    .btn-outline:hover {
      box-shadow: var(--glow-cyan);
      background: rgba(92,225,255,0.08);
    }

    /* ── Text utilities ─────────────────────────────────────────────────── */
    .dim { color: var(--text-dim); }
    .faint { color: var(--text-faint); }
    .green { color: var(--green); }
    .cyan { color: var(--cyan); }
    .amber { color: var(--amber); }
    .red { color: var(--red); }

    .glow-green { text-shadow: var(--glow-green); }
    .glow-cyan { text-shadow: var(--glow-cyan); }

    /* ── Wallet address / monospace blocks ──────────────────────────────── */
    .wallet-addr {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--green);
      word-break: break-all;
      background: var(--bg);
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      margin: 8px 0;
    }

    /* ── Badges ─────────────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-green { background: rgba(0,255,156,0.12); color: var(--green); border: 1px solid rgba(0,255,156,0.3); }
    .badge-cyan  { background: rgba(92,225,255,0.12); color: var(--cyan); border: 1px solid rgba(92,225,255,0.3); }
    .badge-amber { background: rgba(255,210,63,0.12); color: var(--amber); border: 1px solid rgba(255,210,63,0.3); }
    .badge-dim   { background: rgba(136,136,136,0.12); color: var(--text-dim); border: 1px solid rgba(136,136,136,0.2); }
    .badge-red   { background: rgba(255,59,59,0.12); color: var(--red); border: 1px solid rgba(255,59,59,0.3); }

    /* ── Pulse animation for live indicators ───────────────────────────── */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--green); }
      50% { opacity: 0.4; box-shadow: 0 0 2px var(--green); }
    }
    .pulse-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    /* ── Scan/marquee for ticker ───────────────────────────────────────── */
    @keyframes ticker-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-track {
      display: flex;
      gap: 32px;
      animation: ticker-scroll 40s linear infinite;
      white-space: nowrap;
      width: max-content;
    }

    /* ── Boot cursor blink ─────────────────────────────────────────────── */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }

    /* ── Glow fade-in for boot sequence ───────────────────────────────── */
    @keyframes glow-in {
      from { opacity: 0; text-shadow: none; }
      to { opacity: 1; text-shadow: var(--glow-green); }
    }
    .glow-in { animation: glow-in 0.5s ease-out forwards; }

    /* ── Bento grid ────────────────────────────────────────────────────── */
    .bento {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .bento > * { margin: 0; }
    .bento .span-2 { grid-column: span 2; }
    .bento .span-3 { grid-column: span 3; }
    .bento .span-4 { grid-column: span 4; }
    .bento .row-2 { grid-row: span 2; }

    @media (max-width: 768px) {
      .bento { grid-template-columns: repeat(2, 1fr); }
      .bento .span-2, .bento .span-3, .bento .span-4 { grid-column: span 2; }
      .bento .row-2 { grid-row: span 1; }
    }

    /* ── Divider with ASCII ────────────────────────────────────────────── */
    .ascii-divider {
      color: var(--border-bright);
      font-size: 10px;
      letter-spacing: 0;
      overflow: hidden;
      margin: 16px 0;
      white-space: nowrap;
    }

    /* ── Preformatted code blocks ─────────────────────────────────────── */
    pre {
      background: var(--bg);
      padding: 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.6;
    }
    code { font-family: var(--font-mono); }

    /* ── Inputs ────────────────────────────────────────────────────────── */
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), var(--glow-green);
    }

    /* ── Scrollbar ─────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--green-deep); }

    /* ── Tables ────────────────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 700;
      color: var(--text-dim);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-bright);
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tr:hover { background: rgba(0,255,156,0.03); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
